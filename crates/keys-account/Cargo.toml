[package]
name = "keys-account"
description = "Account identity for the Keys password manager: the recovery code, and the account-signed statements that make a device one of the account's."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lints]
workspace = true

# Everything here is already in the workspace lockfile; this crate adds no new
# crate to the tree.
[dependencies]
# The account and device key sets, and the account identity key's statements.
keys-pairing = { path = "../keys-pairing" }
thiserror = "2"
zeroize = "1"
