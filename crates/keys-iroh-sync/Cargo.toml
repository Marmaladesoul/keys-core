[package]
name = "keys-iroh-sync"
description = "iroh-based sync transport for the Keys password manager. Wraps iroh + iroh-docs + iroh-blobs into a stable library API that Keys clients (Mac, iOS, Windows) depend on for device sync, fleet sync, and friendship sync."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
publish.workspace = true

[lib]
# rlib only: its uniffi exports ship inside keys-ffi's library (one native
# component per client), and other workspace crates and the integration
# tests consume the Rust API directly.
crate-type = ["rlib"]

[lints]
workspace = true

[dependencies]
iroh = "1.0.0-rc.0"
iroh-blobs = "0.101"
iroh-docs = "0.99"
iroh-gossip = "0.99"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time"] }
anyhow = "1"
thiserror = "2"
tracing = "0.1"
# Backs the opt-in diagnostic log (`enable_diagnostic_log`). `Targets`
# rather than `EnvFilter` keeps regex out of the shipped library; the
# filter is a fixed string, never caller-supplied.
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt", "std", "registry"] }
n0-future = "0.3"
futures-util = "0.3"
# uniffi from the workspace manifest, like keys-ffi: the two crates'
# scaffolding share one library, so they must be on one uniffi version.
uniffi = { workspace = true, features = ["tokio"] }
# Zeroize the heap allocation holding the caller's 32-byte ed25519
# secret on drop, matching the bridge-layer scrub pattern already in
# keys-ffi. Without this, dropped Identity allocations sit in the
# heap until the allocator reuses them.
zeroize = { version = "1", features = ["derive"] }

[dev-dependencies]
# Store-and-forward tests merge what the transport delivered into a real vault.
keys-ffi = { path = "../keys-ffi" }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tempfile = "3"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "macros", "time", "test-util"] }
